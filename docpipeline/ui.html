<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Educational Documentary — Production Pipeline</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, "Noto Sans Bengali", sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh; margin: 0; padding: 22px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .stages { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .stage {
    flex: 1; min-width: 150px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 9px; padding: 11px; font-size: 12px; color: #8b949e;
  }
  .stage.active { border-color: #58a6ff; color: #58a6ff; }
  .stage.done { border-color: #3fb950; color: #3fb950; }
  .stage b { display: block; font-size: 13px; color: #e6edf3; margin-bottom: 3px; }
  .stage.done b { color: #3fb950; }
  .stage.active b { color: #58a6ff; }
  textarea, input {
    width: 100%; padding: 11px; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }
  button {
    background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer; margin: 10px 6px 0 0; font-family: inherit;
  }
  button:hover { background: #2ea043; }
  button.ghost { background: #21262d; color: #8b949e; }
  button.ghost:hover { background: #30363d; color: #e6edf3; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .log { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px;
         font-family: ui-monospace, monospace; font-size: 12px; max-height: 300px; overflow-y: auto;
         white-space: pre-wrap; line-height: 1.6; }
  .ok { color: #3fb950; } .err { color: #f85149; } .info { color: #58a6ff; } .warn { color: #d29922; }
  .proj { display: flex; justify-content: space-between; align-items: center; gap: 10px;
          padding: 10px; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 7px; background: #0d1117; }
  .proj b { font-size: 14px; } .proj small { color: #8b949e; }
  .badge { background: #21262d; border-radius: 12px; padding: 2px 9px; font-size: 11px; color: #8b949e; }
  .out { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 14px;
         max-height: 420px; overflow-y: auto; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  a { color: #58a6ff; }
  h3 { font-size: 14px; margin: 0 0 10px; color: #e6edf3; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 AI Educational Documentary</h1>
  <div class="sub">৪-স্টেজ Production Pipeline · সম্পূর্ণ ফ্রি · ৯:১৬ ভার্টিক্যাল · বাংলা ন্যারেশন</div>

  <div class="card">
    <h3>নতুন প্রজেক্ট</h3>
    <input id="topic" placeholder="টপিক লিখুন — যেমন: একটি শুঁয়োপোকা কীভাবে প্রজাপতি হয়ে ওঠে">
    <button onclick="runStage(1)">STAGE 1 — স্ক্রিপ্ট তৈরি করুন</button>
  </div>

  <div class="card" id="wcard" style="display:none">
    <h3>পাইপলাইন</h3>
    <div class="stages" id="stages"></div>
    <div style="margin-top:12px">
      <button class="ghost" onclick="runStage(2)">STAGE 2 — শট লিস্ট</button>
      <button class="ghost" onclick="runStage(3)">STAGE 3 — ভিডিও প্রম্পট</button>
      <button class="ghost" onclick="runStage(4)">STAGE 4 — ক্লিপ বানান</button>
      <button class="ghost" onclick="showOutput()">📄 আউটপুট দেখুন</button>
    </div>
    <div style="margin-top:12px">
      <h3>প্রজেক্ট</h3>
      <div id="plist"></div>
    </div>
  </div>

  <div class="card" id="lcard" style="display:none">
    <h3>লগ</h3>
    <div class="log" id="log"></div>
  </div>

  <div class="card" id="ocard" style="display:none">
    <h3>আউটপুট</h3>
    <div class="out" id="out"></div>
  </div>
</div>

<script>
let PID = null;
const logEl = document.getElementById('log');
function log(m, c) {
  const t = new Date().toLocaleTimeString('en-GB');
  logEl.innerHTML += `<span class="${c||'info'}">[${t}] ${m}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function setBusy(b) {
  document.querySelectorAll('button').forEach(x => x.disabled = b);
  document.getElementById('lcard').style.display = 'block';
}

async function runStage(stage) {
  const topic = document.getElementById('topic').value.trim();
  if (stage === 1 && !topic) { alert('টপিক লিখুন'); return; }
  if (stage > 1 && !PID) { alert('প্রথমে Stage 1 চালান'); return; }
  setBusy(true);
  log(`STAGE ${stage} শুরু...`, 'ok');
  const url = stage === 1 ? '/api/stage/1' : '/api/stage/' + stage + '/' + encodeURIComponent(PID);
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic })
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    if (stage === 1) PID = d.project_id;
    log(`✓ Stage ${stage} সম্পন্ন। project=${PID}`, 'ok');
    document.getElementById('wcard').style.display = 'block';
    await refresh();
    showOutput();
  } catch (e) {
    log('✗ ' + e.message, 'err');
  }
  setBusy(false);
}

async function refresh() {
  const r = await fetch('/api/projects');
  const d = await r.json();
  document.getElementById('plist').innerHTML = d.projects.map(p => `
    <div class="proj">
      <div><b>${p.title}</b><br><small>${p.id} · স্টেজ ${p.stage} · শট ${p.shots} · প্রম্পট ${p.prompts} · ক্লিপ ${p.assets}</small></div>
      <span class="badge">${p.approved[4] ? 'সম্পন্ন' : 'চলমান'}</span>
    </div>`).join('');

  if (PID) {
    const st = await (await fetch('/api/project/' + encodeURIComponent(PID))).json();
    const stages = [
      ['১', 'ন্যারেশন স্ক্রিপ্ট', 1], ['২', 'শট লিস্ট', 2], ['৩', 'ভিডিও প্রম্পট', 3], ['৪', 'AI ক্লিপ', 4]
    ];
    document.getElementById('stages').innerHTML = stages.map(([n, label, s]) => {
      const cls = st.approved[s] ? 'done' : (st.current_stage === s ? 'active' : '');
      return `<div class="stage ${cls}"><b>STAGE ${n} — ${label}</b>${st.approved[s] ? 'অনুমোদিত' : (st.current_stage === s ? 'চলমান' : 'অপেক্ষায়')}</div>`;
    }).join('');
  }
}

async function showOutput() {
  if (!PID) return;
  document.getElementById('ocard').style.display = 'block';
  const st = await (await fetch('/api/project/' + encodeURIComponent(PID))).json();
  const files = [];
  if (st.script) files.push(['01_script.md', 'ন্যারেশন স্ক্রিপ্ট']);
  if (st.shotlist) files.push(['02_shotlist.md', 'শট লিস্ট']);
  if (st.prompts) files.push(['03_video_prompts.md', 'ভিডিও প্রম্পট']);
  // APPROVED সংস্করণ (§১০)
  if (st.script) files.push(['01_script_APPROVED.md', '✅ স্ক্রিপ্ট — APPROVED']);
  if (st.shotlist) files.push(['02_shotlist_APPROVED.md', '✅ শট লিস্ট — APPROVED']);
  if (st.prompts) files.push(['03_video_prompts_APPROVED.md', '✅ ভিডিও প্রম্পট — APPROVED']);
  if (st.fix_log && st.fix_log.length) {
    html_fix = '\n\n🔧 সংশোধন ইতিহাস:\n' + st.fix_log.map(f => `  Stage ${f.stage} · ${f.target} · ${f.instruction}`).join('\n');
  }
  let html = `<b>${st.script?.title || st.topic}</b>\n\n`;
  let html_fix = '';
  html += `শব্দ: ${st.script?.word_count || 0} | দৈর্ঘ্য: ${st.script?.estimated_seconds || 0}s | শট: ${st.shotlist?.shots?.length || 0} | প্রম্পট: ${st.prompts?.prompts?.length || 0}\n\n`;
  const srcs = st.script?.research?.sources || [];
  if (srcs.length) {
    html += `📚 রিসার্চ সোর্স (${srcs.length}):\n`;
    srcs.forEach(s => { html += `  <a href="${s.url}" target="_blank">${s.title}</a> (${s.lang})\n`; });
    html += `\n`;
  }
  files.forEach(([f, label]) => {
    html += `📄 <a href="/api/file/${encodeURIComponent(PID + '/' + f)}" target="_blank">${label} (${f})</a>\n`;
  });
  if (st.assets?.length) {
    html += `\n🎞️ ক্লিপ:\n`;
    st.assets.forEach(a => {
      if (a.clip) html += `  <a href="/api/file/${encodeURIComponent(PID + '/clips/' + a.clip.split('/').pop())}" target="_blank">Shot ${a.shot_no} (${a.duration_sec}s)</a>\n`;
    });
  }
  html += html_fix;
  html += `\n\n<button onclick="approve(1)">✅ Stage 1 অনুমোদন</button> `;
  html += `<button onclick="approve(2)">✅ Stage 2 অনুমোদন</button> `;
  html += `<button onclick="approve(3)">✅ Stage 3 অনুমোদন</button> `;
  html += `<button onclick="runQC()">📋 কোয়ালিটি চেক</button>\n`;
  html += `<br><br><b>🎯 নির্দিষ্ট অংশ সংশোধন (§৯):</b><br>`;
  html += `<input id="fixstage" type="number" value="2" min="1" max="3" style="width:60px"> স্টেজ `;
  html += `<input id="fixtarget" placeholder="শট নং (০৫) বা সেকশন (CLOSING)" style="width:180px"> `;
  html += `<input id="fixinstr" placeholder="সংশোধনের নির্দেশনা" style="width:320px"> `;
  html += `<button onclick="doFix()">✏️ সংশোধন করো</button>\n`;
  document.getElementById('out').innerHTML = html;
}

async function approve(stage) {
  if (!PID) return;
  try {
    const r = await fetch('/api/approve/' + encodeURIComponent(PID) + '/' + stage, {method: 'POST'});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log('✓ Stage ' + stage + ' অনুমোদিত (v' + d.version + ')', 'ok');
    await refresh(); showOutput();
  } catch (e) { log('✗ ' + e.message, 'err'); }
}

async function doFix() {
  if (!PID) return;
  const stage = document.getElementById('fixstage').value;
  const target = document.getElementById('fixtarget').value.trim();
  const instruction = document.getElementById('fixinstr').value.trim();
  if (!target || !instruction) { log('✗ টার্গেট ও নির্দেশনা দিন', 'err'); return; }
  setBusy(true);
  log('সংশোধন হচ্ছে: Stage ' + stage + ' · ' + target + '…');
  try {
    const r = await fetch('/api/fix/' + encodeURIComponent(PID) + '/' + stage + '/' + encodeURIComponent(target), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({instruction})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log('✓ সংশোধন সম্পন্ন: ' + target + ' (বাকি অপরিবর্তিত)', 'ok');
    await refresh(); showOutput();
  } catch (e) { log('✗ ' + e.message, 'err'); }
  setBusy(false);
}

async function runQC() {
  if (!PID) return;
  try {
    const r = await fetch('/api/qc/' + encodeURIComponent(PID));
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log('✓ কোয়ালিটি চেক: ' + d.passed + '/' + d.total + ' পাস', d.passed === d.total ? 'ok' : 'info');
    d.checks.forEach(c => log('  ' + (c.ok ? '✓' : '✗') + ' ' + c.name + ' — ' + c.note, c.ok ? 'ok' : 'err'));
  } catch (e) { log('✗ ' + e.message, 'err'); }
}

refresh();
</script>
</body>
</html>
